<header class="hero" id="inicio">

    <svg class="corner" aria-hidden="true" focusable="false"></svg>

        <path d="M34 50a14 14 0 0 0 8 14" fill="none" stroke="#fffbe9" stroke-width="2.4" stroke-linecap="round" opacity=".9"/>
        <g class="sky-stars" fill="currentColor"><path class="st st1" d="M80 14c.6 4 1.6 5 5 5.6-3.4.6-4.4 1.6-5 5.4-.6-3.8-1.6-4.8-5-5.4 3.4-.6 4.4-1.6 5-5.6z"/><path class="st st2" d="M88 46c.4 3 1.2 3.6 3.6 4-2.4.4-3.2 1-3.6 3.6-.4-2.6-1.2-3.2-3.6-3.6 2.4-.4 3.2-1 3.6-4z"/><path class="st st3" d="M18 18c.4 3 1.2 3.6 3.6 4-2.4.4-3.2 1-3.6 3.6-.4-2.6-1.2-3.2-3.6-3.6 2.4-.4 3.2-1 3.6-4z"/></g>

      <p class="sky-hi" id="skyHi">buenos días</p>

    <div class="birds" aria-hidden="true">
      <svg class="bird b1"><use href="#d-bird"/></svg><svg class="bird b2"><use href="#d-bird"/></svg><svg class="bird b3"><use href="#d-bird"/></svg>

    <div class="petals" aria-hidden="true"></div>

    <h1 class="hero-name">
      <!-- El filete de "La" es un tallo con bugambilia que cuelga sobre "ona" -->
      <span class="hero-la">La<svg class="la-stem" aria-hidden="true" focusable="false"></svg></span>
      <span class="hero-casona" data-fit>Casona<svg class="c-bloom" aria-hidden="true" focusable="false"></svg><svg class="a-plant" aria-hidden="true" focusable="false"></svg></span>
      <span class="flies" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>

    <svg class="doodle hero-star boil" aria-hidden="true"><use href="#d-star"/></svg>
    <svg class="garland" aria-hidden="true" focusable="false"></svg>

  <div class="hero-stage">
    <figure class="hero-facade">
      <img class="boil" src="assets/menu/fachada-colonial-footer.webp" width="2078" height="757" alt="Ilustración de la fachada colonial de La Casona" decoding="async" fetchpriority="high">
      <svg class="ground" aria-hidden="true" focusable="false"></svg>
      <svg class="hero-pot hero-pot--l boil" viewBox="0 0 120 150" aria-hidden="true"><use href="#d-bush"/></svg>
      <svg class="hero-pot hero-pot--r boil" viewBox="0 0 120 150" aria-hidden="true"><use href="#d-agave"/></svg>
    </figure>
  </div>

  <!-- Tarjeta de modo: la rellena JS según el QR (mesa) o pedido en línea -->
  <section class="mode-card" id="modeCard" aria-live="polite"></section>
</header>

<nav class="index" id="indice" aria-labelledby="indiceTitle">
  <div class="index-head">
    <h2 id="indiceTitle" class="index-title">Índice</h2>
    <p class="index-hint">14 categorías <svg class="doodle index-arrow boil" aria-hidden="true"><use href="#d-arrow"/></svg></p>
  </div>
  <ol class="index-grid" id="indexGrid"></ol>
</nav>

<nav class="catbar" id="catbar" aria-label="Categorías">
  <div class="catbar-track" id="catbarTrack"></div>
</nav>

<main id="menu" class="menu" tabindex="-1">
  <noscript><p class="noscript">Activa JavaScript para ver el menú y hacer tu pedido.</p></noscript>
</main>

<footer class="signoff">
  <svg class="doodle signoff-ring boil" aria-hidden="true"><use href="#d-ring"/></svg>
  <p class="signoff-script">Buen provecho</p>
  <figure class="signoff-facade"><img class="boil" src="assets/menu/fachada-colonial-footer.webp" width="2078" height="757" alt="" loading="lazy" decoding="async"></figure>
  <p class="signoff-phone" data-phone hidden></p>
  <p class="signoff-small">La Casona · Precios en pesos mexicanos (MXN)</p>
</footer>

<!-- Barra inferior del pedido -->
<div class="orderbar" id="orderbar" hidden>
  <button class="orderbar-btn" id="orderbarBtn" type="button" aria-haspopup="dialog">
    <span class="orderbar-count" id="orderbarCount">0</span>
    <span class="orderbar-label"><span id="orderbarMode">Tu pedido</span><small id="orderbarItems">0 productos</small></span>
    <span class="orderbar-total" id="orderbarTotal">$0</span>
    <span class="orderbar-go" aria-hidden="true">Ver →</span>
  </button>
</div>

<!-- Ficha de producto con opciones / extras -->
<dialog class="sheet" id="itemSheet" aria-labelledby="itemSheetTitle">
  <form method="dialog" class="sheet-inner" id="itemForm"></form>
</dialog>

<!-- Pedido + datos -->
<dialog class="sheet sheet--cart" id="cartSheet" aria-labelledby="cartTitle">
  <div class="sheet-inner" id="cartInner"></div>
</dialog>

<!-- Ticket final -->
<dialog class="sheet sheet--ticket" id="ticketSheet" aria-labelledby="ticketTitle">
  <div class="sheet-inner" id="ticketInner"></div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
