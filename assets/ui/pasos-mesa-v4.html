<!doctype html>
<html lang="es-MX"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Elige · Revisa · Envía · Standalone</title>
<!-- SOLO PREVIEW: en el archivo real las 4 fuentes van embebidas en base64 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500&display=swap" rel="stylesheet">
<style>
:root{--paper:#f3ede1;--paper-2:#ebe2d0;--card:#faf6ee;--ink:#1d1813;--ink-2:#4a4137;--ink-3:#7c7062;--terra:#b4532a;--rosa:#e7b591;--leaf:#97b07a;--f-man:'Casona ManEater',Georgia,serif;--f-ui:'Nunito C','Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;--frame:calc(1s / 7);color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--card);color:var(--ink);font:400 18px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;font-synthesis:none}
.standalone-stage{width:calc(100% - 36px);max-width:720px;margin:40px auto;padding:0}
.ln{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ln-thin{stroke-width:1.6}.ln-paper{stroke:var(--card)}.ln-accent{stroke:var(--terra)}
.fill-soft{fill:var(--paper-2)}.fill-paper{fill:var(--card)}.fill-accent{fill:var(--terra)}.fill-leaf{fill:var(--leaf)}

/* ── Pasos · motion v4 ─────────────────────────────────────────────
   Una sola historia, contada por un solo objeto.
   El "+" suelta una ficha terracota; la ficha viaja por el conector,
   aterriza en el ticket y se MORPHEA en el renglón nuevo. El ticket
   la confirma con la palomita, y de la punta de la palomita sale la
   ficha otra vez rumbo a la campana: la aplasta, la campana suena.
   · Solo existe UN acento caliente a la vez: el ojo siempre sabe
     dónde mirar.
   · Idle: cada material respira (vapor, hoja, ticket, metal).
   · Sin hover. Se pausa fuera de pantalla y con la pestaña oculta.
   ───────────────────────────────────────────────────────────────── */
.steps{--gap:clamp(8px,2vw,18px);--art:clamp(56px,13vw,74px);list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap);position:relative}
.step{position:relative;display:grid;justify-items:center;align-content:start;text-align:center;gap:4px;padding:14px 6px 12px;border-radius:18px;background:var(--paper);-webkit-tap-highlight-color:transparent}

/* conector: punteado tinta; la ficha lo va cargando de terracota */
.wire{position:absolute;right:100%;top:calc(14px + var(--art) / 2 - 1px);width:var(--gap);border-top:2px dotted var(--ink-3);pointer-events:none}
.wire-fill{position:absolute;left:0;right:0;top:-2px;border-top:2px dotted var(--terra);clip-path:inset(0 100% 0 0)}

/* la ficha: el único objeto que cruza contenedores */
.token{position:absolute;left:0;top:0;width:9px;height:9px;border-radius:50%;background:var(--terra);opacity:0;pointer-events:none;z-index:3;will-change:transform,opacity}

.step-art{display:block;width:var(--art);aspect-ratio:1}
.step-art svg{width:100%;height:100%;overflow:visible}
.step-art g,.step-art path,.step-art ellipse,.step-art circle{transform-box:fill-box}

.step-n{position:absolute;left:10px;top:8px;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--paper);font:400 14px/1 var(--f-man);transition:background-color .3s cubic-bezier(.37,0,.63,1)}
.step.is-on .step-n{background:var(--terra)}

.step b{position:relative;display:inline-block;padding-bottom:6px;margin-bottom:-2px;font:400 clamp(18px,4.4vw,22px)/1 var(--f-man);letter-spacing:.005em}
/* marca de "aquí vas": entra por la izquierda, sale por la derecha → sigue a la ficha */
.mark{position:absolute;left:14%;right:14%;bottom:0;height:2px;border-radius:1px;background:var(--terra);transform:scaleX(0);transform-origin:100% 50%;transition:transform .34s cubic-bezier(.65,0,.35,1)}
.step.is-on .mark{transform:scaleX(1);transform-origin:0 50%;transition:transform .46s cubic-bezier(.22,1,.36,1)}
.step small{font:500 clamp(12.5px,3vw,14px)/1.25 var(--f-ui);color:var(--ink-3);max-width:16ch;text-wrap:balance}

/* trazos que se dibujan (pathLength=1) */
.s1 .burst path,.s1 .steam path,.s2 .r2p,.s2 .tick,.s3 .ding path{stroke-dasharray:1 1;stroke-dashoffset:0}
.s1 .tap,.s3 .glint path{opacity:0}
.s1 .btn-top,.s1 .plate,.s1 .tap,.s2 .stamp,.s3 .ding,.s3 .glint path{transform-origin:50% 50%}
.s1 .bowl,.s2 .paper,.s2 .paper-idle,.s3 .dome{transform-origin:50% 100%}
.s1 .leaf,.s1 .leaf-idle{transform-origin:0% 100%}
.s3 .knob{transform-origin:50% 100%}

/* estado inicial cuando hay motion (sin JS / reduced-motion se ve la pose completa) */
.steps.is-armed .step-art{opacity:0}
.is-motion .fx path{stroke-dashoffset:1;opacity:0}
.is-motion .s2 .r2{opacity:0}
.is-motion .s2 .r2p,.is-motion .s2 .tick{stroke-dashoffset:1}

/* ── IDLE · suave, lento, nunca compite con la acción ── */
.is-motion .s1 .steam path{animation:st-wisp 2.8s cubic-bezier(.45,0,.55,1) infinite}
.is-motion .s1 .steam path+path{animation-delay:-1.4s}
.is-motion .s1 .leaf-idle{animation:st-sway 3.4s cubic-bezier(.45,0,.55,1) infinite}
.is-motion .s1 .btn-float{animation:st-bob 2.4s cubic-bezier(.45,0,.55,1) infinite alternate}
.is-motion .s2 .paper-idle{animation:st-levitate 4.2s cubic-bezier(.45,0,.55,1) infinite alternate}
.is-motion .s3 .glint path{animation:st-glint 6s cubic-bezier(.33,0,.2,1) infinite}
/* vapor: nace por la base, sube, se deshace por la base */
@keyframes st-wisp{0%{translate:0 2px;opacity:0;stroke-dashoffset:.7}30%{opacity:1;stroke-dashoffset:0}62%{opacity:1}100%{translate:0 -4px;opacity:0;stroke-dashoffset:-.7}}
@keyframes st-sway{0%,100%{rotate:0deg}32%{rotate:-4deg}68%{rotate:2.5deg}}
@keyframes st-bob{from{translate:0 0}to{translate:0 -1.4px}}
@keyframes st-levitate{from{translate:0 .4px;rotate:-.7deg}to{translate:0 -1.2px;rotate:.7deg}}
/* destello del metal: chico → grande → chico, y silencio */
@keyframes st-glint{0%,86%{opacity:0;scale:.2;rotate:0deg}89%{opacity:1;scale:1.1;rotate:20deg}93%{opacity:1;scale:.6;rotate:35deg}96%,100%{opacity:0;scale:.2;rotate:45deg}}

.steps.is-paused *{animation-play-state:paused!important}

@media(prefers-reduced-motion:reduce){
  .step-art,.step *{animation:none!important;transition:none!important}
  .steps .step-art{opacity:1!important}
}
</style></head>
<body>
<main class="standalone-stage" aria-label="Cómo pedir desde tu mesa">
<ol class="steps">
  <li class="step">
    <span class="step-art s1"><svg viewBox="0 0 64 64" aria-hidden="true"><g class="art">
      <ellipse cx="28" cy="51.5" rx="17" ry="2.6" class="fill-soft plate"></ellipse>
      <g class="steam"><path d="M21 18c-1.8-2.4 1.8-4.2 0-7" pathLength="1" class="ln"></path><path d="M27 17c-1.8-2.4 1.8-4.2 0-7" pathLength="1" class="ln"></path></g>
      <g class="bowl">
        <path d="M15 35c0-7.2 5.8-12 13-12s13 4.8 13 12" class="fill-soft ln"></path>
        <g class="leaf-idle"><g class="leaf"><path d="M29 23.5c.8-3.6 4.2-5.6 8-5-.8 3.6-4.2 5.6-8 5z" class="fill-leaf ln ln-thin"></path><path d="M29.6 23l4.8-3" class="ln ln-thin"></path></g></g>
        <path d="M10 35c1.5 9.5 8.6 15 18 15s16.5-5.5 18-15z" class="fill-paper ln"></path>
        <path d="M8 35h40" class="ln"></path>
      </g>
      <circle cx="51.5" cy="19.5" r="9.7" style="fill:var(--ink)"></circle>
      <g class="btn-float">
        <circle cx="50" cy="18" r="8.5" class="ln ln-accent ln-thin tap"></circle>
        <g class="btn-top"><circle cx="50" cy="18" r="8.5" class="fill-accent ln btn-disc"></circle><path d="M50 14v8M46 18h8" class="ln ln-paper"></path></g>
        <g class="burst fx"><path d="M50 6V2.5" pathLength="1" class="ln ln-accent"></path><path d="M41.7 9.7l-2.5-2.5" pathLength="1" class="ln ln-accent"></path><path d="M58.3 9.7l2.5-2.5" pathLength="1" class="ln ln-accent"></path></g>
      </g>
    </g></svg></span>
    <span class="step-n">1</span><b>Elige<span class="mark" aria-hidden="true"></span></b><small>toca + en lo que se te antoje</small>
    <span class="token" aria-hidden="true"></span>
  </li>
  <li class="step">
    <span class="wire" aria-hidden="true"><span class="wire-fill"></span></span>
    <span class="step-art s2"><svg viewBox="0 0 64 64" aria-hidden="true"><g class="art"><g class="paper-idle"><g class="paper">
      <path d="M16 6h32v50l-5-4-5 4-6-4-6 4-5-4-5 4z" class="fill-paper ln"></path>
      <path d="M22 17h10M38 17h4" class="ln ln-thin row r0"></path>
      <path d="M22 24h12M38 24h4" class="ln ln-thin row r1"></path>
      <path d="M22 31h8" class="ln ln-thin row r2"></path>
      <path d="M38 31h4" pathLength="1" class="ln ln-thin row r2p"></path>
      <g class="stamp"><path d="M33 42l5 5 10-12" pathLength="1" class="ln ln-accent tick"></path></g>
    </g></g></g></svg></span>
    <span class="step-n">2</span><b>Revisa<span class="mark" aria-hidden="true"></span></b><small>abre tu pedido abajo</small>
  </li>
  <li class="step">
    <span class="wire" aria-hidden="true"><span class="wire-fill"></span></span>
    <span class="step-art s3"><svg viewBox="0 0 64 64" aria-hidden="true"><g class="art">
      <g class="dome">
        <g class="knob"><path d="M32 30v-5M28 25h8" class="ln"></path></g>
        <path d="M14 48a18 18 0 0 1 36 0z" class="fill-accent ln"></path>
        <path d="M22 36a10 10 0 0 1 6-5" class="ln ln-paper"></path>
        <g class="glint"><path d="M23 34.4v6.4M19.8 37.6h6.4" class="ln ln-paper ln-thin"></path></g>
      </g>
      <path d="M10 50h44" class="ln"></path>
      <g class="ding fx"><path d="M13 28L8 24" pathLength="1" class="ln ln-accent"></path><path d="M51 28l5-4" pathLength="1" class="ln ln-accent"></path><path d="M18 20l-4-6" pathLength="1" class="ln ln-accent"></path><path d="M46 20l4-6" pathLength="1" class="ln ln-accent"></path></g>
    </g></svg></span>
    <span class="step-n">3</span><b>Envía<span class="mark" aria-hidden="true"></span></b><small>llega directo a la cocina</small>
  </li>
</ol>
<script>
(()=>{
  const list=document.querySelector('.steps'); if(!list) return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches||!Element.prototype.animate) return;

  const q=s=>list.querySelector(s), qa=s=>[...list.querySelectorAll(s)];
  const steps=qa('.step'), arts=qa('.step-art'), wires=qa('.wire'), fills=qa('.wire-fill'), badges=qa('.step-n');
  const token=q('.token');
  const E={
    tap:q('.s1 .tap'),btn:q('.s1 .btn-top'),disc:q('.s1 .btn-disc'),burst:qa('.s1 .burst path'),
    bowl:q('.s1 .bowl'),plate:q('.s1 .plate'),leaf:q('.s1 .leaf'),
    paper:q('.s2 .paper'),r2:q('.s2 .r2'),r2p:q('.s2 .r2p'),tick:q('.s2 .tick'),stamp:q('.s2 .stamp'),
    knob:q('.s3 .knob'),knobTop:q('.s3 .knob path'),dome:q('.s3 .dome'),ding:q('.s3 .ding'),dings:qa('.s3 .ding path'),glint:q('.s3 .glint path')
  };
  const root=getComputedStyle(document.documentElement);
  const INK=root.getPropertyValue('--ink').trim()||'#1d1813';
  const TERRA=root.getPropertyValue('--terra').trim()||'#b4532a';

  /* ── curvas ── */
  const OUT='cubic-bezier(.22,1,.36,1)', IN='cubic-bezier(.55,0,1,.45)', IO='cubic-bezier(.65,0,.35,1)', SINE='cubic-bezier(.37,0,.63,1)';
  const linearOK=!!(window.CSS&&CSS.supports&&CSS.supports('animation-timing-function','linear(0, 1)'));
  const spring=(k,c,fallback)=>{                       // resorte real → linear()
    const w=Math.sqrt(k),z=c/(2*w),wd=w*Math.sqrt(1-z*z);
    const f=t=>1-Math.exp(-z*w*t)*(Math.cos(wd*t)+z*w/wd*Math.sin(wd*t));
    let end=0; for(let t=0;t<4;t+=1/240) if(Math.abs(1-f(t))>.002) end=t;
    const n=Math.max(16,Math.round(end*60)),pts=[];
    for(let i=0;i<=n;i++) pts.push(i===n?1:+f(i/n*end).toFixed(4));
    return {easing:linearOK?'linear('+pts.join(',')+')':fallback,duration:Math.round(end*1000)};
  };
  const POP=spring(420,18,'cubic-bezier(.34,1.56,.64,1)');
  const SOFT=spring(220,17,'cubic-bezier(.34,1.4,.64,1)');
  const bez=(x1,y1,x2,y2)=>{
    const cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx,cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;
    const X=t=>((ax*t+bx)*t+cx)*t,dX=t=>(3*ax*t+2*bx)*t+cx,Y=t=>((ay*t+by)*t+cy)*t;
    return u=>{let t=u;for(let i=0;i<8;i++){const d=dX(t);if(Math.abs(d)<1e-6)break;t-=(X(t)-u)/d;}return Y(Math.min(1,Math.max(0,t)));};
  };
  const travel=bez(.42,0,.18,1);                        // sale con decisión, aterriza suave
  const osc=(amp,cycles,decay=4,n=32)=>{const k=[];for(let i=0;i<=n;i++){const t=i/n;k.push({rotate:(i===n?0:amp*Math.exp(-decay*t)*Math.sin(t*cycles*2*Math.PI)).toFixed(3)+'deg'});}return k;};

  /* ── reloj propio: todo se pausa junto ── */
  let now=0,last=0,raf=0,playing=false,queue=[];
  const live=new Set(),keyed={};
  const later=(ms,fn)=>{const it={at:now+ms,fn};let i=queue.length;while(i&&queue[i-1].at>it.at)i--;queue.splice(i,0,it);};
  const frame=ts=>{now+=Math.min(ts-last,100);last=ts;while(queue.length&&queue[0].at<=now)queue.shift().fn();raf=requestAnimationFrame(frame);};
  const play=()=>{if(playing)return;playing=true;live.forEach(a=>a.play());last=performance.now();raf=requestAnimationFrame(frame);};
  const pause=()=>{if(!playing)return;playing=false;cancelAnimationFrame(raf);live.forEach(a=>a.pause());};
  const A=(el,kf,o={},key)=>{
    if(!el) return null;
    const a=el.animate(kf,Object.assign({fill:'backwards'},o));
    live.add(a);const drop=()=>live.delete(a);a.addEventListener('finish',drop);a.addEventListener('cancel',drop);
    if(key){const p=keyed[key];keyed[key]=a;if(p)p.cancel();}
    return a;
  };

  /* ── geometría (todo relativo al primer paso, donde vive la ficha) ── */
  const box=el=>{const r=el.getBoundingClientRect(),o=steps[0].getBoundingClientRect();return{x:r.left-o.left,y:r.top-o.top,w:r.width,h:r.height,cx:r.left-o.left+r.width/2,cy:r.top-o.top+r.height/2,r:r.right-o.left};};
  const unit=()=>arts[0].getBoundingClientRect().width/64;
  const f2=n=>n.toFixed(2);
  const T=(x,y,a=0,sx=1,sy=sx)=>`translate(${f2(x)}px,${f2(y)}px) translate(-50%,-50%) rotate(${a.toFixed(4)}rad) scale(${sx.toFixed(4)},${sy.toFixed(4)})`;
  let TK=9;

  /* ── estados de paso ── */
  const on=k=>{steps[k].classList.add('is-on');
    A(badges[k],[{scale:1,easing:'cubic-bezier(.2,0,.3,1)'},{scale:1.3,offset:.28,easing:SINE},{scale:.93,offset:.62,easing:SINE},{scale:1}],{duration:480});};
  const off=k=>steps[k].classList.remove('is-on');

  /* ── la ficha ── */
  const spawn=(x,y,rise)=>{
    TK=8*unit(); token.style.width=token.style.height=f2(TK)+'px';
    A(token,[{transform:T(x,y+rise*.4,0,.2),opacity:0,easing:OUT},{transform:T(x,y-rise*.15,0,1.22),opacity:1,offset:.55,easing:SINE},{transform:T(x,y-rise*.1,0,1),opacity:1}],{duration:240,fill:'forwards'},'tk');
    return {x,y:y-rise*.1};
  };
  const fly=(S,D,from,to,done)=>{
    const u=unit(),W=box(wires[to-1]),fromB=box(steps[from]),toB=box(steps[to]);
    const dist=Math.hypot(D.x-S.x,D.y-S.y);
    const dur=Math.round(Math.min(860,Math.max(560,420+dist*1.5)));
    const C={x:(S.x+D.x)/2,y:Math.min(S.y,D.y)-24*u};
    const N=44,pts=[];let vmax=1e-6,leave=1,enter=1;
    for(let i=0;i<=N;i++){
      const s=i/N,p=travel(s),dp=(travel(Math.min(1,s+.004))-travel(Math.max(0,s-.004)))/(Math.min(1,s+.004)-Math.max(0,s-.004));
      const x=(1-p)*(1-p)*S.x+2*(1-p)*p*C.x+p*p*D.x, y=(1-p)*(1-p)*S.y+2*(1-p)*p*C.y+p*p*D.y;
      const dx=2*(1-p)*(C.x-S.x)+2*p*(D.x-C.x), dy=2*(1-p)*(C.y-S.y)+2*p*(D.y-C.y);
      const v=Math.hypot(dx,dy)*dp; vmax=Math.max(vmax,v); pts.push({x,y,a:Math.atan2(dy,dx),v});
    }
    const kf=[],wk=[];
    pts.forEach((pt,i)=>{
      const st=1+.55*Math.pow(pt.v/vmax,1.4);            // estira con la velocidad
      const edge=(i===0||i===N);
      kf.push({transform:T(pt.x,pt.y,edge?0:pt.a,edge?1:st,edge?1:1/st),opacity:1});
      const f=Math.min(1,Math.max(0,(pt.x-W.x)/W.w));
      wk.push({clipPath:`inset(0 ${f2((1-f)*100)}% 0 0)`});
      if(leave===1&&pt.x>fromB.r) leave=i/N;
      if(enter===1&&pt.x>toB.x) enter=i/N;
    });
    A(token,kf,{duration:dur,easing:'linear',fill:'forwards'},'tk');
    fills[to-1].style.clipPath='inset(0 0 0 0)';
    A(fills[to-1],wk,{duration:dur,easing:'linear'});
    later(dur*leave,()=>off(from));
    later(dur*enter,()=>on(to));
    later(dur,done);
  };

  /* ── 1 · Elige ── */
  const tap=()=>{
    A(E.btn,[{translate:'0 0',scale:1,easing:'cubic-bezier(.3,0,.5,1)'},{translate:'-.3px -.3px',scale:1.06,offset:.4,easing:IN},{translate:'1.5px 1.5px',scale:.93}],{duration:170,fill:'forwards'},'btn');
    later(120,()=>A(E.tap,[{scale:.85,opacity:.9,strokeWidth:2.4},{scale:1.8,opacity:0,strokeWidth:.5}],{duration:560,easing:OUT}));
    later(170,()=>{A(E.btn,[{translate:'1.5px 1.5px',scale:.93},{translate:'0 0',scale:1}],POP,'btn');react1();});
  };
  const react1=()=>{
    E.burst.forEach((p,i)=>A(p,[{strokeDashoffset:1,opacity:1,easing:OUT},{strokeDashoffset:0,opacity:1,offset:.4,easing:'cubic-bezier(.5,0,.75,0)'},{strokeDashoffset:-1,opacity:1}],{duration:420,delay:i?30:0}));
    const k=[0,.16,.42,.64,1];
    A(E.bowl,[
      {translate:'0 0',scale:'1 1',offset:k[0],easing:'cubic-bezier(.3,0,.5,1)'},
      {translate:'0 0',scale:'1.07 .9',offset:k[1],easing:'cubic-bezier(.2,.8,.4,1)'},
      {translate:'0 -3.5px',scale:'.96 1.05',offset:k[2],easing:'cubic-bezier(.6,0,.8,.4)'},
      {translate:'0 0',scale:'1.05 .94',offset:k[3],easing:'cubic-bezier(.2,.8,.4,1)'},
      {translate:'0 0',scale:'1 1',offset:k[4]}],{duration:640,delay:40});
    A(E.plate,[{scale:'1 1',offset:k[0]},{scale:'1.06 1',offset:k[1]},{scale:'.8 1',offset:k[2]},{scale:'1.05 1',offset:k[3]},{scale:'1 1',offset:k[4]}],{duration:640,delay:40,easing:SINE});
    later(140,()=>A(E.leaf,osc(13,2.5,3.6),{duration:1000,easing:'linear'}));
    later(150,()=>{
      const u=unit(),D=box(E.disc);
      const S=spawn(D.cx,D.y-1*u,6*u);
      later(240,()=>{
        const R=box(E.r2),sw=1.6*u;
        fly(S,{x:R.x-sw/2+TK/2,y:R.cy},0,1,land1);
      });
    });
  };

  /* ── 2 · Revisa: la ficha se vuelve renglón ── */
  const land1=()=>{
    const u=unit(),R=box(E.r2),sw=1.6*u,L=R.x-sw/2,len=R.w+sw,y=R.cy,x0=L+TK/2;
    A(token,[
      {transform:T(x0,y,0,1,1),opacity:1,easing:OUT},
      {transform:T(x0+TK*.08,y,0,1.32,.7),opacity:1,offset:.24,easing:IO},
      {transform:T(L+len/2,y,0,len/TK,sw/TK),opacity:1}],{duration:320,fill:'forwards'},'tk');
    later(320,()=>{
      E.r2.style.stroke=TERRA;E.r2.style.opacity=1;              // relevo exacto: misma forma, mismo color
      A(token,[{opacity:0},{opacity:0}],{duration:1,fill:'forwards'},'tk');
      E.r2p.style.stroke=TERRA;E.r2p.style.strokeDashoffset=0;
      A(E.r2p,[{strokeDashoffset:1},{strokeDashoffset:0}],{duration:260,delay:40,easing:OUT});
      A(E.paper,[{scale:'1 1',easing:OUT},{scale:'1.025 .965',offset:.25,easing:SINE},{scale:'.99 1.015',offset:.6,easing:SINE},{scale:'1 1'}],{duration:480});
      later(480,confirm);
    });
  };
  const confirm=()=>{
    E.tick.style.strokeDashoffset=0;
    A(E.tick,[{strokeDashoffset:1},{strokeDashoffset:0}],{duration:320,easing:'cubic-bezier(.6,0,.2,1)'});
    later(250,()=>{
      A(E.stamp,[{scale:1,rotate:'0deg',easing:OUT},{scale:1.24,rotate:'-8deg'}],{duration:110,fill:'forwards'},'stamp');
      later(110,()=>A(E.stamp,[{scale:1.24,rotate:'-8deg'},{scale:1,rotate:'0deg'}],POP,'stamp'));
      [E.r2,E.r2p].forEach(el=>{el.style.stroke=INK;A(el,[{stroke:TERRA},{stroke:INK}],{duration:480,easing:SINE});}); // el acento pasa del renglón a la palomita
    });
    later(1050,send);
  };

  /* ── 3 · Envía: de la punta de la palomita a la campana ── */
  const send=()=>{
    const u=unit(),P=box(E.tick);
    A(E.stamp,[{scale:1},{scale:.9,offset:.4},{scale:1}],{duration:280,easing:SINE});
    const S=spawn(P.r,P.y,5*u);
    later(240,()=>{
      const K=box(E.knobTop);
      fly(S,{x:K.cx,y:K.y-1.2*u-TK/2},1,2,land2);
    });
  };
  const land2=()=>{
    const u=unit(),K=box(E.knobTop),x=K.cx,y=K.y-1.2*u-TK/2;
    A(token,[
      {transform:T(x,y,0,1,1),opacity:1,easing:'cubic-bezier(.3,0,.6,1)'},
      {transform:T(x,y+1.4*u,0,1.5,.58),opacity:1,offset:.35,easing:IN},
      {transform:T(x,y+3.2*u,0,.15,.15),opacity:0}],{duration:240,fill:'forwards'},'tk');
    A(E.knob,[{translate:'0 0',easing:'cubic-bezier(.3,0,.6,1)'},{translate:'0 3px',offset:.3,easing:OUT},{translate:'0 0'}],{duration:440});
    later(70,ring);
  };
  const ding=w=>E.dings.forEach((p,i)=>A(p,[
      {strokeDashoffset:1,opacity:1,strokeWidth:w,easing:OUT},
      {strokeDashoffset:0,opacity:1,strokeWidth:w,offset:.45,easing:'cubic-bezier(.5,0,.75,0)'},
      {strokeDashoffset:-1,opacity:1,strokeWidth:w}],{duration:400,delay:i>1?40:0}));
  const ring=()=>{
    A(E.dome,[{scale:'1 1',easing:OUT},{scale:'1.07 .9',offset:.2,easing:SINE},{scale:'.97 1.04',offset:.45,easing:SINE},{scale:'1 1'}],{duration:540});
    A(E.dome,osc(-7,3,4),{duration:1300,easing:'linear'});
    ding(2.4);
    later(440,()=>{A(E.ding,[{scale:.82},{scale:.82}],{duration:460});ding(1.6);});  // eco, más fino
    later(1050,()=>A(E.glint,[{opacity:0,scale:.2,rotate:'0deg'},{opacity:1,scale:1.15,rotate:'25deg',offset:.4},{opacity:0,scale:.2,rotate:'45deg'}],{duration:440,easing:SINE}));
    later(1800,()=>{off(2);later(450,reset);});
  };

  /* ── resolución: el flujo se vacía hacia la cocina y respira ── */
  const reset=()=>{
    fills.forEach((f,i)=>{f.style.clipPath='inset(0 0 0 100%)';A(f,[{clipPath:'inset(0 0 0 0)'},{clipPath:'inset(0 0 0 100%)'}],{duration:560,delay:i*90,easing:IO});});
    [E.r2,E.r2p,E.tick].forEach(el=>{el.style.opacity=0;A(el,[{opacity:1},{opacity:0}],{duration:380,easing:SINE});});
    later(720,()=>{fills.forEach(f=>f.removeAttribute('style'));[E.r2,E.r2p,E.tick].forEach(el=>el.removeAttribute('style'));});
    later(1350,story);
  };
  const story=()=>{on(0);later(180,tap);};

  /* ── entrada: los dibujos caen y asientan, los conectores se trazan ── */
  let started=false,inView=false;
  list.classList.add('is-motion','is-armed');
  const begin=()=>{
    started=true;list.classList.remove('is-armed');
    arts.forEach((a,i)=>A(a,[{opacity:0,translate:'0 -10px',rotate:'-5deg'},{opacity:1,translate:'0 0',rotate:'0deg'}],Object.assign({},SOFT,{delay:i*90})));
    wires.forEach((w,i)=>A(w,[{clipPath:'inset(-2px 100% -2px 0)'},{clipPath:'inset(-2px 0 -2px 0)'}],{duration:420,delay:220+i*90,easing:OUT}));
    later(1000,story);
  };
  const sync=()=>{
    const ok=inView&&!document.hidden;
    list.classList.toggle('is-paused',!ok);
    if(!ok){pause();return;}
    play(); if(!started) begin();
  };
  if('IntersectionObserver' in window){
    new IntersectionObserver(([e])=>{inView=e.isIntersecting;sync();},{threshold:.35}).observe(list);
  }else{inView=true;sync();}
  document.addEventListener('visibilitychange',sync);
})();
</script>
</main>
</body></html>
