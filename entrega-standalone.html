<aside class="export-tools" data-export-remove><button type="button" id="downloadStandalone">Descargar HTML con fuentes incluidas</button><p id="exportStatus" role="status">Solo las dos tarjetas originales, con animaciones y selección. Sin pedidos, cuentas ni almacenamiento.</p></aside>
<script data-standalone-interaction>
// Interacción de la copia: solo cambia la selección visual, sin guardar datos.
(() => {
  const buttons = [...document.querySelectorAll('[data-fulfil]')];
  function select(button) {
    buttons.forEach(b => {b.setAttribute('aria-checked', String(b === button)); b.tabIndex = b === button ? 0 : -1;});
  }
  buttons.forEach((button, i) => {
    button.addEventListener('click', () => select(button));
    button.addEventListener('keydown', e => {
      if (!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(e.key)) return;
      e.preventDefault();
      const n = e.key === 'Home' ? 0 : e.key === 'End' ? buttons.length - 1 : (i + (['ArrowLeft','ArrowUp'].includes(e.key) ? -1 : 1) + buttons.length) % buttons.length;
      select(buttons[n]); buttons[n].focus();
    });
  });
})();
</script>
